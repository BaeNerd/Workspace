<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DX전략2팀 커피 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 32px;
    }

    h1 {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 14px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
      letter-spacing: 2px;
    }

    /* ── 컨테이너: 모바일=세로, 데스크탑=가로 ── */
    .container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 960px;
    }

    /* ── 휠 영역 (모바일: 상단) ── */
    .wheel-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .wheel-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
    }

    .pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left:  11px solid transparent;
      border-right: 11px solid transparent;
      border-top:   24px solid #e74c3c;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
      z-index: 10;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 50%;
      box-shadow: 0 6px 32px rgba(0,0,0,0.28);
    }

    /* 회전 시간 + 버튼 묶음 */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
    }

    .duration-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 9px 18px;
      width: 100%;
      justify-content: center;
    }

    .duration-row label {
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .duration-input {
      width: 54px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      background: rgba(255,255,255,0.2);
      color: #fff;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
      transition: border-color 0.2s;
    }

    .duration-input::-webkit-inner-spin-button,
    .duration-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .duration-input:focus { border-color: rgba(255,255,255,0.9); }

    .duration-unit {
      color: rgba(255,255,255,0.85);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .btn-spin {
      width: 100%;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 13px 0;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(245,87,108,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 1px;
      touch-action: manipulation;
    }

    .btn-spin:active:not(:disabled) { transform: scale(0.97); }
    .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-sound {
      width: 100%;
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.75);
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 50px;
      padding: 9px 0;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      touch-action: manipulation;
      transition: background 0.2s, color 0.2s;
    }
    .btn-sound.on {
      background: rgba(255,255,255,0.32);
      color: #fff;
      border-color: rgba(255,255,255,0.7);
    }

    /* ── 참가자 패널 (모바일: 하단) ── */
    .panel {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .panel-header h2 { font-size: 0.9rem; color: #495057; }

    .total-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .total-badge.ok   { background: #d3f9d8; color: #2f9e44; }
    .total-badge.warn { background: #fff3bf; color: #e67700; }

    .input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .input-row input[type="text"] {
      flex: 1;
      border: 1.5px solid #dee2e6;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }

    .input-row input[type="text"]:focus { border-color: #667eea; }

    .btn-add {
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 19px;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    /* 이름 목록: 모바일 2열 그리드 */
    .name-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      max-height: 280px;
      overflow-y: auto;
    }

    .name-list::-webkit-scrollbar { width: 3px; }
    .name-list::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 4px; }

    .name-list li {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 7px;
      border-radius: 8px;
      color: #fff;
      min-width: 0;
    }

    .color-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      flex-shrink: 0;
    }

    .name-text {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .weight-wrap {
      display: flex;
      align-items: center;
      gap: 1px;
      flex-shrink: 0;
    }

    .weight-input {
      width: 38px;
      border: none;
      border-radius: 5px;
      padding: 2px 4px;
      font-size: 11px;
      font-weight: 700;
      text-align: right;
      background: rgba(255,255,255,0.25);
      color: #fff;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .weight-input::-webkit-inner-spin-button,
    .weight-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .weight-input:focus { background: rgba(255,255,255,0.45); }

    .weight-unit {
      font-size: 10px;
      color: rgba(255,255,255,0.85);
      font-weight: 600;
    }

    .btn-del {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-size: 12px;
      padding: 0 1px;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-del:hover { color: #fff; }

    /* ── 당첨 모달 ── */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-bg.show { display: flex; }

    .modal {
      background: #fff;
      border-radius: 24px;
      padding: 36px 40px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      animation: pop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    }

    @keyframes pop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .modal .emoji { font-size: 3.5rem; }
    .modal .label { font-size: 0.9rem; color: #6c757d; margin: 8px 0 4px; }
    .modal .winner-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #f5576c;
      margin-bottom: 24px;
      word-break: break-word;
    }

    .btn-close {
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 11px 36px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      touch-action: manipulation;
    }

    /* ══════════════════════════════════════════════
       데스크탑 (768px 이상)
    ══════════════════════════════════════════════ */
    @media (min-width: 768px) {
      body { padding: 28px 20px 40px; }

      h1 { font-size: 2rem; margin-bottom: 24px; }

      .container {
        flex-direction: row;
        align-items: flex-start;
        gap: 24px;
      }

      /* 패널: 왼쪽 고정 */
      .panel {
        width: 270px;
        flex-shrink: 0;
        padding: 20px;
      }

      /* 이름 목록: 데스크탑 1열 */
      .name-list {
        grid-template-columns: 1fr;
        max-height: 420px;
      }

      .name-list li { padding: 6px 8px; gap: 7px; }
      .name-text    { font-size: 13px; }
      .weight-input { width: 46px; font-size: 12px; }
      .weight-unit  { font-size: 11px; }
      .btn-del      { font-size: 13px; }

      /* 휠 영역: 오른쪽 */
      .wheel-area { flex: 1; gap: 20px; }

      .wheel-wrap  { max-width: 500px; }

      .controls { max-width: 500px; }

      .pointer {
        top: -10px;
        border-left:  14px solid transparent;
        border-right: 14px solid transparent;
        border-top:   30px solid #e74c3c;
      }

      .btn-spin { padding: 14px 0; font-size: 1.15rem; }

      .modal { padding: 44px 60px; max-width: 420px; }
      .modal .emoji       { font-size: 4rem; }
      .modal .winner-name { font-size: 2.6rem; }
      .btn-close          { width: auto; padding: 11px 36px; }
    }
  </style>
</head>
<body>

  <h1>🎯 DX전략2팀 커피 게임</h1>

  <div class="container">

    <!-- 휠 (모바일: 상단 / 데스크탑: 오른쪽) -->
    <div class="wheel-area">
      <div class="wheel-wrap" id="wheelWrap">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
      </div>

      <div class="controls">
        <div class="duration-row">
          <label>⏱ 회전 시간</label>
          <input id="durationInput" class="duration-input"
            type="number" min="1" max="30" step="1" value="5" />
          <span class="duration-unit">초</span>
        </div>
        <button class="btn-spin" id="spinBtn" onclick="spin()" disabled>🎰 돌리기!</button>
        <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔇 소리 꺼짐</button>
      </div>
    </div>

    <!-- 참가자 패널 (모바일: 하단 / 데스크탑: 왼쪽) -->
    <div class="panel">
      <div class="panel-header">
        <h2>👥 참가자 (<span id="count">0</span>명)</h2>
        <span class="total-badge ok" id="totalBadge">합계 100%</span>
      </div>
      <div class="input-row">
        <input id="nameInput" type="text" placeholder="이름 입력..." maxlength="10" />
        <button class="btn-add" onclick="addName()">+</button>
      </div>
      <ul class="name-list" id="nameList"></ul>
    </div>

  </div>

  <!-- 당첨 모달 -->
  <div class="modal-bg" id="modalBg" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="emoji">🎉</div>
      <div class="label">당첨자</div>
      <div class="winner-name" id="winnerName"></div>
      <button class="btn-close" onclick="closeModal()">확인</button>
    </div>
  </div>

  <script>
    const canvas   = document.getElementById('wheel');
    const ctx      = canvas.getContext('2d');
    const wheelWrap = document.getElementById('wheelWrap');
    const spinBtn  = document.getElementById('spinBtn');

    /* ── 색상 팔레트 ─────────────────────────────────── */
    const COLORS = [
      '#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#FECA57',
      '#A29BFE','#55EFC4','#FDCB6E','#E17055','#00CEC9',
      '#6C5CE7','#FAB1A0','#81ECEC','#F9CA24','#B8E994'
    ];

    /* ── 데이터 ───────────────────────────────────────── */
    const DEFAULT_NAMES = [
      '김욱','임우택','장우창','정나영','김형민','임다울',
      '성주경','소형선','김민석','김정은','배상혁','유영민','이무현'
    ];

    let people       = [];
    let isSpinning   = false;
    let currentAngle = 0;

    /* ── 반응형 캔버스 크기 조절 ─────────────────────── */
    let canvasReady = false;

    function resizeCanvas() {
      const size = wheelWrap.clientWidth;
      if (size <= 0) return;          // 레이아웃 미완료 상태는 무시
      if (canvas.width !== size) {
        canvas.width  = size;
        canvas.height = size;
      }
      if (!canvasReady) {
        canvasReady = true;
        initPeople();                 // 첫 유효 사이즈 확정 후 초기화
      } else {
        drawWheel();
      }
    }

    const ro = new ResizeObserver(resizeCanvas);
    ro.observe(wheelWrap);

    /* ── 가중치 유틸 ──────────────────────────────────── */
    const KWANG = '꽝';

    // 내림(floor)으로 1자리 → 합계가 반드시 100% 이하가 되도록 보장
    function defaultWeight(n) {
      return Math.floor(1000 / n) / 10;
    }

    // 실제 인원 가중치 합산 후 남는 나머지를 꽝으로 자동 추가/갱신
    function syncKwang() {
      people = people.filter(p => p.name !== KWANG);
      const total     = people.reduce((s, p) => s + p.weight, 0);
      const remainder = parseFloat((100 - total).toFixed(1));
      if (remainder > 0) {
        people.push({ name: KWANG, weight: remainder });
      }
    }

    /* ── 초기 데이터 ──────────────────────────────────── */
    function initPeople() {
      const n = DEFAULT_NAMES.length;
      const w = defaultWeight(n);
      people = DEFAULT_NAMES.map(name => ({ name, weight: w }));
      syncKwang();
      refresh();
    }

    /* ── 이름 추가 ────────────────────────────────────── */
    function addName() {
      const input = document.getElementById('nameInput');
      const name  = input.value.trim();
      if (!name || people.some(p => p.name === name)) { input.select(); return; }
      const real = people.filter(p => p.name !== KWANG).concat({ name, weight: 0 });
      const w    = defaultWeight(real.length);
      people     = real.map(p => ({ ...p, weight: w }));
      syncKwang();
      input.value = '';
      input.focus();
      refresh();
    }

    document.getElementById('nameInput')
      .addEventListener('keydown', e => { if (e.key === 'Enter') addName(); });

    /* ── 이름 삭제 ────────────────────────────────────── */
    function removeName(idx) {
      people.splice(idx, 1);
      const real = people.filter(p => p.name !== KWANG);
      if (real.length > 0) {
        const w = defaultWeight(real.length);
        people  = real.map(p => ({ ...p, weight: w }));
      } else {
        people = [];
      }
      syncKwang();
      refresh();
    }

    /* ── 가중치 변경 → 나머지 비례 재분배로 합계 100% 유지 ── */
    function updateWeight(idx, val) {
      const v = parseFloat(val);
      if (isNaN(v) || v < 0.1) return;

      const otherIndices = people.map((_, i) => i).filter(i => i !== idx);
      if (otherIndices.length === 0) return;

      // 변경 값이 너무 크면 나머지 인원이 최소 0.1%씩 가질 수 있게 클램프
      const maxVal = parseFloat((100 - otherIndices.length * 0.1).toFixed(1));
      people[idx].weight = Math.min(Math.max(0.1, parseFloat(v.toFixed(1))), maxVal);

      const remaining    = parseFloat((100 - people[idx].weight).toFixed(1));
      const othersTotal  = otherIndices.reduce((s, i) => s + people[i].weight, 0);

      // 나머지 인원에게 현재 비율에 비례해 분배 (마지막 사람이 오차 흡수)
      let distributed = 0;
      otherIndices.forEach((i, j) => {
        if (j < otherIndices.length - 1) {
          const w = parseFloat(((people[i].weight / othersTotal) * remaining).toFixed(1));
          people[i].weight = Math.max(0.1, w);
          distributed += people[i].weight;
        }
      });
      const lastIdx = otherIndices[otherIndices.length - 1];
      people[lastIdx].weight = Math.max(0.1, parseFloat((remaining - distributed).toFixed(1)));

      refresh();
    }

    function updateTotalBadge() {
      const total   = people.reduce((s, p) => s + p.weight, 0);
      const badge   = document.getElementById('totalBadge');
      const rounded = Math.round(total * 10) / 10;
      badge.textContent = `합계 ${rounded}%`;
      badge.className   = 'total-badge ' + (Math.abs(total - 100) < 0.5 ? 'ok' : 'warn');
    }

    /* ── 목록 렌더링 ──────────────────────────────────── */
    function refresh() {
      const ul = document.getElementById('nameList');
      document.getElementById('count').textContent = people.length;

      ul.innerHTML = people.map((p, i) => `
        <li style="background:${p.name === KWANG ? '#868e96' : COLORS[i % COLORS.length]}">
          <div class="color-dot"></div>
          <span class="name-text">${p.name}</span>
          <div class="weight-wrap">
            <input class="weight-input" type="number"
              min="0.1" max="100" step="0.1" value="${p.weight}"
              onchange="updateWeight(${i}, this.value)" />
            <span class="weight-unit">%</span>
          </div>
          <button class="btn-del" onclick="removeName(${i})">✕</button>
        </li>`).join('');

      spinBtn.disabled = people.length < 2;
      updateTotalBadge();
      drawWheel();
    }

    /* ── 섹션 각도 계산 ───────────────────────────────── */
    function getSegments() {
      const total = people.reduce((s, p) => s + p.weight, 0);
      const segs  = [];
      let cumAngle = 0;
      for (const p of people) {
        const angle = (p.weight / total) * Math.PI * 2;
        segs.push({ angle, startAngle: cumAngle });
        cumAngle += angle;
      }
      return segs;
    }

    /* ── 원판 그리기 ──────────────────────────────────── */
    function drawWheel() {
      const W  = canvas.width;
      const cx = W / 2, cy = W / 2;
      const r  = cx - W * 0.024;
      const n  = people.length;

      ctx.clearRect(0, 0, W, W);

      /* 외곽 흰 테두리 */
      ctx.beginPath();
      ctx.arc(cx, cy, r + W * 0.016, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();

      if (n === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#f1f3f5';
        ctx.fill();
        ctx.fillStyle    = '#adb5bd';
        ctx.font         = `${Math.round(W * 0.036)}px sans-serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('이름을 추가해 주세요', cx, cy);
        return;
      }

      const segs = getSegments();
      const baseFs = W * 0.032;

      for (let i = 0; i < n; i++) {
        const start = currentAngle + segs[i].startAngle;
        const end   = start + segs[i].angle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();
        ctx.fillStyle   = people[i].name === KWANG ? '#868e96' : COLORS[i % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth   = Math.max(1.5, W * 0.004);
        ctx.stroke();

        /* 텍스트 */
        if (segs[i].angle > 0.18) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(currentAngle + segs[i].startAngle + segs[i].angle / 2);
          ctx.textAlign    = 'right';
          ctx.fillStyle    = '#fff';
          const fs = Math.round(n > 12 ? baseFs * 0.78 : n > 8 ? baseFs * 0.9 : baseFs);
          ctx.font         = `bold ${fs}px sans-serif`;
          ctx.shadowColor  = 'rgba(0,0,0,0.3)';
          ctx.shadowBlur   = 3;
          ctx.fillText(people[i].name, r - W * 0.036, fs * 0.36);
          ctx.restore();
        }
      }

      /* 중앙 원 */
      const cr = W * 0.05;
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.fillStyle   = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#dee2e6';
      ctx.lineWidth   = W * 0.006;
      ctx.stroke();
      ctx.fillStyle    = '#495057';
      ctx.font         = `bold ${Math.round(W * 0.028)}px sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur   = 0;
      ctx.fillText('GO', cx, cy);
    }

    /* ── 소리 ────────────────────────────────────────── */
    let soundOn  = false;
    let audioCtx = null;

    function toggleSound() {
      soundOn = !soundOn;
      const btn = document.getElementById('soundBtn');
      btn.textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
      btn.classList.toggle('on', soundOn);
      if (soundOn && !audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTick(speed) {
      if (!soundOn || !audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'triangle';
      o.frequency.value = 480 + speed * 120;   // 속도에 따라 음높이 변화
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
      o.start(audioCtx.currentTime);
      o.stop(audioCtx.currentTime + 0.06);
    }

    function playFanfare() {
      if (!soundOn || !audioCtx) return;
      const notes = [523, 659, 784, 1047]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine';
        o.frequency.value = freq;
        const t = audioCtx.currentTime + i * 0.13;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.25, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        o.start(t); o.stop(t + 0.4);
      });
    }

    /* ── 가중치 기반 당첨자 추첨 ──────────────────────── */
    function pickWinner() {
      const total = people.reduce((s, p) => s + p.weight, 0);
      let rand = Math.random() * total;
      for (let i = 0; i < people.length; i++) {
        rand -= people[i].weight;
        if (rand <= 0) return i;
      }
      return people.length - 1;
    }

    /* ── 스핀 ─────────────────────────────────────────── */
    function spin() {
      if (isSpinning || people.length < 2) return;
      isSpinning       = true;
      spinBtn.disabled = true;

      const winnerIdx    = pickWinner();
      const segs         = getSegments();
      const targetCenter = segs[winnerIdx].startAngle + segs[winnerIdx].angle / 2;
      const target       = -Math.PI / 2 - targetCenter;
      const extraSpins   = (Math.floor(Math.random() * 5) + 8) * Math.PI * 2;
      const diff         = ((target - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const totalRot     = extraSpins + diff;

      const secs      = Math.min(30, Math.max(1, parseInt(document.getElementById('durationInput').value) || 5));
      const duration  = secs * 1000;
      const startAngle  = currentAngle;
      const startTime   = performance.now();
      let   lastAngle   = currentAngle;
      let   lastTickAt  = 0;

      function animate(now) {
        const t      = Math.min((now - startTime) / duration, 1);
        const eased  = 1 - Math.pow(1 - t, 4);
        currentAngle = startAngle + totalRot * eased;
        drawWheel();

        // 틱 소리: 포인터를 섹션 경계가 지날 때마다 재생
        const speed     = Math.abs(currentAngle - lastAngle);   // 현재 각속도
        const tickGap   = Math.max(0.04, 0.35 - speed * 6);    // 빠를수록 간격 짧게
        if (now - lastTickAt > tickGap * 1000 && speed > 0.002) {
          playTick(Math.min(speed * 10, 1));
          lastTickAt = now;
        }
        lastAngle = currentAngle;

        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          currentAngle     = startAngle + totalRot;
          isSpinning       = false;
          spinBtn.disabled = false;
          drawWheel();
          playFanfare();
          setTimeout(() => showWinner(people[winnerIdx].name), 300);
        }
      }

      requestAnimationFrame(animate);
    }

    /* ── 당첨자 모달 ──────────────────────────────────── */
    function showWinner(name) {
      document.getElementById('winnerName').textContent = name;
      document.getElementById('modalBg').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modalBg').classList.remove('show');
    }

    /* 초기 실행
       ResizeObserver가 발동하면 resizeCanvas → initPeople 순으로 실행됨.
       일부 브라우저에서 발동이 늦는 경우를 대비해 rAF 폴백을 추가. */
    requestAnimationFrame(() => {
      if (!canvasReady) resizeCanvas();
    });
  </script>
</body>
</html>
